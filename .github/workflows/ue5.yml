name: UE5 rendered integration (self-hosted)
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Absolute path to a licensed UE5 installation on this runner
        required: true
        type: string
permissions:
  contents: read
jobs:
  rendered:
    runs-on: [self-hosted, Windows, X64, ue5]
    env:
      UE_ROOT: ${{ inputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_ue5.py --engine "$env:UE_ROOT" --output .artifacts/ue-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ue5-evidence
          path: .artifacts/ue-ci/evidence
